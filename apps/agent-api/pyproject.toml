[project]
name = "agent-api"
version = "0.1.0"
description = "Sijo Agent API: LangGraph-orchestrated natural-language search over BoondManager via MCP."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "langgraph>=0.2.40",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.5.0",
    "mcp>=1.0",
    "anthropic>=0.39.0",
    "openai>=1.54.0",
    "pyjwt[crypto]>=2.9.0",
    "aiosqlite>=0.20.0",
    "azure-data-tables>=12.5.0",
    "azure-identity>=1.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "anyio>=4.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]
