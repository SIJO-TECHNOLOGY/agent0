name: Deploy mcp-boondmanager

on:
  push:
    branches: [main]
    paths:
      - "apps/mcp-boondmanager/**"
      - ".github/workflows/deploy-mcp-boondmanager.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-mcp-boondmanager
  cancel-in-progress: false

jobs:
  # Gate deployment on the test suite for THIS commit. The Docker image build
  # uses -DskipTests (tests are validated here, not inside the image build), so
  # this job is what actually guarantees the deployed SHA passed its tests.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run tests
        run: mvn -B -f apps/mcp-boondmanager/pom.xml test

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build image in ACR
        run: >
          az acr build
          --registry ${{ vars.ACR_NAME }}
          --image agent0/mcp-boondmanager:${{ github.sha }}
          apps/mcp-boondmanager

      - name: Deploy to Container Apps
        run: >
          az containerapp update
          --name agent0-mcp
          --resource-group ${{ vars.AZURE_RESOURCE_GROUP }}
          --image ${{ vars.ACR_NAME }}.azurecr.io/agent0/mcp-boondmanager:${{ github.sha }}
