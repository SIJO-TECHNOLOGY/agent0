name: Deploy agent-api

on:
  push:
    branches: [main]
    paths:
      - "apps/agent-api/**"
      - ".github/workflows/deploy-agent-api.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-agent-api
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build image in ACR
        run: >
          az acr build
          --registry ${{ vars.ACR_NAME }}
          --image agent0/agent-api:${{ github.sha }}
          apps/agent-api

      - name: Deploy to Container Apps
        run: >
          az containerapp update
          --name agent0-api
          --resource-group ${{ vars.AZURE_RESOURCE_GROUP }}
          --image ${{ vars.ACR_NAME }}.azurecr.io/agent0/agent-api:${{ github.sha }}
